<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Div vs Span Example</title>
  <style>

    .section {
      border: 2px solid darkblue;
      padding: 15px;
      margin: 10px 0;
    }

    .highlight {
      color: red;
      font-weight: bold;
      background-color: yellow;
    }
  </style>
</head>
<body>
  <!-- Div groups the header -->
  <div class="section">
    <h1>My Article</h1>
    <p>Written by <span class="highlight">Sowjanya</span></p>
  </div>

  <!-- Div groups the content -->
  <div class="section">
    <h2>Introduction</h2>
    <p>
      HTML has two generic containers: 
      <span class="highlight">&lt;div&gt;</span> for block‑level grouping 
      and <span class="highlight">&lt;span&gt;</span> for inline styling.
    </p>
  </div>

  <!-- Div groups the footer -->
  <div class="section">
    <p>Thank you for reading! <span class="highlight">😊</span></p>
  </div>

  <form action="/submit" method="post">
  <label for="name">**Name**:</label>
  <input type="text" id="name" name="name">
  <input type="submit" value="**Send**">
</form>

<form action="/submit" method="post">
  <input type="submit" value="Submit Form">
</form>

<form action="/submit" method="post">
  <button type="submit">Submit Form</button>
</form><br><br>


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pseudo-element Example</title>
  <style>
    h1::before {
      content: "★ ";
      color: gold;
      font-size: 1.2em;
    }
  </style>
</head>
<body>
  <h1>Welcome to My Page</h1>
  <h1>Another Heading</h1>
</body>
</html>

</body>
