<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Card</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../dist/output.css">
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen">
  <div class="max-w-sm w-full bg-white rounded-xl shadow-product p-6 m-4">
    <img src="https://via.placeholder.com/300x200" alt="Product Image" class="rounded-lg mb-4 w-full">
    <h2 class="text-primary text-2xl font-bold mb-2">Awesome Product</h2>
    <p class="text-gray-600 mb-4">This product is stylish, durable, and perfect for everyday use.</p>
    <div class="flex items-center justify-between">
      <span class="text-lg font-semibold text-gray-800">$49.99</span>
      <button class="bg-primary text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition">
        Buy Now
      </button>
    </div>
  </div>

</body>
</html>
