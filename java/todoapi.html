<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Todo List with API</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f4f4f4; }
    input { padding: 8px; margin-right: 5px; }
    button { padding: 8px 12px; }
    ul { list-style: none; padding: 0; margin-top: 15px; }
    li { background: #fff; margin: 5px 0; padding: 10px; border-radius: 4px; }
    .loading { color: blue; }
    .error { color: red; }
  </style>
</head>
<body>

  <h2>📝 Todo List (API)</h2>
  <input type="text" id="taskInput" placeholder="Enter a task...">
  <button onclick="addTask()">Add Task</button>

  <p id="status"></p>
  <ul id="taskList"></ul>

  <script>
    const taskInput = document.getElementById("taskInput");
    const taskList = document.getElementById("taskList");
    const status = document.getElementById("status");

    // Fetch initial todos from API
    async function fetchTodos() {
      try {
        status.textContent = "Loading tasks...";
        status.className = "loading";

        const response = await fetch("https://jsonplaceholder.typicode.com/todos?_limit=5");
        if (!response.ok) throw new Error("Failed to load tasks");

        const todos = await response.json();
        renderTasks(todos);

        status.textContent = "";
      } catch (error) {
        status.textContent = "Error: " + error.message;
        status.className = "error";
      }
    }

    // Add new task to API
    async function addTask() {
      const newTask = taskInput.value.trim();
      if (!newTask) return;

      try {
        status.textContent = "Saving task...";
        status.className = "loading";

        const response = await fetch("https://jsonplaceholder.typicode.com/todos", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            title: newTask,
            completed: false,
            userId: 1
          })
        });

        if (!response.ok) throw new Error("Failed to save task");

        const savedTask = await response.json();
        const li = document.createElement("li");
        li.textContent = savedTask.title;
        taskList.appendChild(li);

        taskInput.value = "";
        status.textContent = "Task saved successfully!";
        status.className = "";
      } catch (error) {
        status.textContent = "Error: " + error.message;
        status.className = "error";
      }
    }

    // Render tasks
    function renderTasks(todos) {
      taskList.innerHTML = "";
      todos.forEach(todo => {
        const li = document.createElement("li");
        li.textContent = todo.title + (todo.completed ? " ✅" : "");
        taskList.appendChild(li);
      });
    }

    // Load tasks on page start
    fetchTodos();
  </script>

</body>
</html>
