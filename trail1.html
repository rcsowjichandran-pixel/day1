<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Media Query Example</title>
  <style>
    body {
      background-color: lightblue;
    }

    @media (max-width: 600px) {
      body {
        background-color: lightgreen;
      }
    }
  </style>
</head>
<body>
  <h1>Resize the window!</h1>
</body>
</html>
