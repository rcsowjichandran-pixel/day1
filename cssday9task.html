<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            border: 1px solid gray;
            background:lightcyan;
            border-radius: 5px;
            padding: 10px;
            text-align: center;
        }
        .container{
            display: grid;
            border: 2px solid black;
            grid-template-columns: repeat(3,1fr);
            grid-template-rows: 100px 200px auto;
            gap: 10px;
        }
        /*mobiel*/
        @media(max-width:600px){
            .container{
                grid-template-columns: 1fr;
            }
        }
        /*tab*/
        @media(min-width:601px) and (max-width:700px) {
            .container{
                grid-template-columns: repeat(2,1fr);
        }
        }
        /*desktop*/
        @media(min-width:701px)and(max-width:800px){
            .container{
                grid-template-columns: repeat(3,1fr);
        }
        }

       
        .grid1{
            margin-top: 10px;
            display: grid;
            border: 2px solid black;
            grid-template-columns: 2fr 1fr 1fr;
        }
        @media(max-width:600px){
            .grid1{
                grid-template-columns: repeat(2,1f);
            }
        }
        .grid2{
            margin-top: 15px;
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 15px;
            border: 2px solid black;
        }
        .gridimage{
            display: grid;
            grid-template-columns: repeat(4,1fr);
            grid-template-rows: 100px;
            gap: 10px;
            margin-top: 15px;
        }
        .gridimage img{
            width: 100%;
            height: 100%;
        }
        .gridimage img:hover{
            transform: scale(1.05);
        }
        .layoutgrid{
            display: grid;
            margin-top: 15px;
            grid-template-rows: 80px auto 50px;
            border: 2px solid black;
        }
        .layoutgrid .header{
            background: aquamarine;
        }
        .layoutgrid .footer{ 
            background: aquamarine;
        }
        .spangrid{
            display: grid;
            grid-template-columns: repeat(3,1fr);
            grid-template-rows: repeat(3,100px);
            gap: 10px;
            border: 2px solid black;
            margin-top: 15px;
        }
        .spangrid .box1{
            grid-column: span 2;
            text-align: center;
            background: rgb(32, 235, 235);
        }
        .spangrid .box3{
            grid-row: span 2;
            text-align: center;
            background: rgb(32, 235, 235);
        }
        .positiongrid{
            display: grid;
            border: 2px solid black;
            margin-top: 15px;
            grid-template-columns: repeat(3,1fr);
            grid-template-rows: repeat(3,100px);
        }
        
        .item1{
            border: 1px solid gray;
            grid-column-start: 3;
        }
        .item2{
            grid-row: 3;
            grid-column: 3;
            border: 1px solid gray;
        }
        .autogrid{
            display: grid;
            border: 2px solid black;
            margin-top: 15px;
            grid-template-columns: repeat(auto-fill,minmax(150px,1fr));
            gap: 15px;          
        }
        .aligngrid{
            display: grid;
            margin-top: 15px;
            border: 2px solid black;
            grid-template-columns: repeat(3,1fr);
            place-items: center;
            grid-auto-rows: 100px;
        }
        .aligngrid .box1{
            align-self: end;
            justify-self: start;
        }
        .dashboard {
            display: grid;
            border: 2px solid black;
            margin-top: 15px;
            grid-template-areas:
                "header header"
                "sidebar content"
                "footer footer";
            grid-template-columns: 200px 1fr;
            grid-template-rows: 80px auto 60px;
            gap: 10px
        }
        .dashboard .header { 
            grid-area: header; background: #ffcccb;
         }
        .dashboard .sidebar { 
            grid-area: sidebar; background: #d3ffd3; 
        }
        .dashboard .content {
             grid-area: content; background: #d3d3ff; 
        }
        .dashboard .footer { 
            grid-area: footer; background: #f0e68c;
         }
        

       
        

        
    </style>
</head>
<body>
    <div class="container">
        <div class="box">box1</div>
        <div class="box">box2</div>
        <div class="box">box3</div>
    </div>
    <div class="grid1">
        <div class="box">box1</div>
        <div class="box">box2</div>
        <div class="box">box3</div>
    </div>
    <div class="grid2">
        <div class="box">box1</div>
        <div class="box">box2</div>
        <div class="box">box3</div>
        <div class="box">box4</div>
        <div class="box">box5</div>
        <div class="box">box6</div>
    </div>
    <div class="gridimage">
        <img src="flower1.jpg" alt="flr1">
        <img src="flower2.jpg" alt="flr2">
        <img src="flower3.jpg" alt="flr3">
        <img src="flower4.jpg" alt="flr4">
    </div>
    <div class="layoutgrid">
        <div class="header">Header</div>
        <div class="content">Content</div>
        <div class="footer">Footer</div>
    </div>
    <div class="spangrid">
        <div class="box1">span 2 column</div>
        <div class="box2">box2</div>
        <div class="box3">span 2 row</div>
    </div>
    <div class="positiongrid">
        <div class="item1">grid starts at thrid column</div>
        <div class="item2">grid positioned in third row n column.</div>
        <div class="item3">box3</div>
    </div>
    <div class="autogrid">
        <div class="box">Box1</div>
        <div class="box">Box2</div>
        <div class="box">Box3</div>
    </div>
    <div class="aligngrid">
        <div class="box1">Box1</div>
        <div class="box2">Box2</div>
        <div class="box3">Box3</div>
    </div>
    <div class="dashboard">
        <div class="header">Header</div>
        <div class="sidebar">Sidebar</div>
        <div class="content">Content</div>
        <div class="footer">Footer</div>
    </div>


</body>
</html>
